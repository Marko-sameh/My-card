<!doctype html>
<html lang="en" dir="ltr" class="h-full overflow-hidden">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Marko Sameh - Software Developer</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Cairo:wght@300;400;600;700;800&display=swap"
      rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        --primary: #3b82f6;
        --secondary: #10b981;
        --bg-dark: #030712;
        --card-bg: rgba(17, 24, 39, 0.7);
      }
      body {
        font-family: "Inter", sans-serif;
        background-color: var(--bg-dark);
        color: #f3f4f6;
        background-image:
          radial-gradient(
            circle at 0% 0%,
            rgba(59, 130, 246, 0.15) 0%,
            transparent 35%
          ),
          radial-gradient(
            circle at 100% 100%,
            rgba(16, 185, 129, 0.1) 0%,
            transparent 35%
          );
      }
      [dir="rtl"] body {
        font-family: "Cairo", sans-serif;
      }

      .glass-card {
        background: var(--card-bg);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .gradient-text {
        background: linear-gradient(135deg, #fff 0%, var(--primary) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .status-pulse {
        position: relative;
      }
      .status-pulse::after {
        content: "";
        position: absolute;
        inset: -2px;
        border-radius: 9999px;
        background: var(--secondary);
        opacity: 0.4;
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.4;
        }
        50% {
          transform: scale(1.5);
          opacity: 0;
        }
      }

      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      .profile-glow {
        box-shadow: 0 0 20px rgba(59, 130, 246, 0.2);
      }
    </style>
  </head>
  <body class="antialiased h-full flex flex-col p-3 md:p-6 overflow-auto">
    <div class="max-w-7xl mx-auto w-full h-full flex flex-col gap-3 md:gap-6">
      <header class="flex justify-between items-center shrink-0">
        <div
          class="flex items-center gap-2 px-3 py-1.5 rounded-full glass-card">
          <div class="w-2 h-2 rounded-full bg-emerald-500 status-pulse"></div>
          <span
            class="text-[10px] font-bold tracking-widest uppercase text-emerald-400"
            id="statusText"
            >Online</span
          >
        </div>
        <button
          id="langBtn"
          class="px-4 py-1.5 rounded-xl glass-card text-xs font-semibold hover:bg-white/10 transition-all">
          العربية
        </button>
      </header>

      <main
        class="flex-1 min-h-0 grid grid-cols-1 lg:grid-cols-12 gap-3 md:gap-6 overflow-hidden">
        <div class="lg:col-span-8 flex flex-col gap-3 md:gap-6 min-h-0">
          <section
            class="glass-card rounded-3xl p-4 md:p-8 relative overflow-hidden shrink-0">
            <div
              class="relative flex flex-row gap-4 md:gap-10 items-center text-left rtl:text-right">
              <div class="relative w-24 h-24 md:w-52 md:h-52 shrink-0">
                <div
                  class="absolute inset-0 bg-gradient-to-tr from-blue-600 to-emerald-500 rounded-3xl rotate-3"></div>
                <div
                  class="relative w-full h-full rounded-3xl overflow-hidden border-2 border-white/20 bg-[#1e293b] profile-glow">
                  <img
                    id="profileImg"
                    src="Marko_photo.jpg"
                    alt="Profile"
                    class="w-full h-full object-cover scale-105" />
                </div>
              </div>

              <div class="min-w-0 flex-1">
                <span
                  class="text-blue-400 text-[10px] md:text-sm font-bold tracking-widest uppercase mb-1 block"
                  id="labelDev"
                  >Frontend Developer</span
                >
                <h1
                  class="text-xl md:text-5xl font-black gradient-text truncate mb-1"
                  id="profileName">
                  Marko Sameh
                </h1>
                <p
                  class="text-xs md:text-xl text-gray-400 font-medium truncate mb-2 md:mb-4">
                  <span id="profileRole">Software Developer</span>
                </p>
                <div class="flex flex-wrap gap-2">
                  <span
                    class="text-[8px] md:text-xs text-blue-300/60 bg-blue-500/10 px-2 py-0.5 md:py-1 rounded-lg border border-blue-500/20"
                    id="profileUniversity"
                    >FUE University</span
                  >
                  <span
                    class="text-[8px] md:text-xs text-emerald-300/60 bg-emerald-500/10 px-2 py-0.5 md:py-1 rounded-lg border border-emerald-500/20"
                    id="profileGraduation"
                    >Class 2025</span
                  >
                </div>
              </div>
            </div>
          </section>

          <div
            class="glass-card rounded-3xl p-4 flex-1 min-h-0 flex flex-col overflow-hidden">
            <h3
              class="text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-3 shrink-0 flex items-center gap-2">
              <span class="w-4 h-px bg-blue-500"></span>
              <span id="stackTitle">Tech Stack</span>
            </h3>
            <div class="flex-1 overflow-y-auto no-scrollbar">
              <div class="flex flex-wrap gap-2" id="stackTags"></div>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-3 shrink-0">
            <button
              id="cvBtn"
              class="group relative px-4 py-3 rounded-2xl bg-white text-gray-900 font-bold overflow-hidden text-xs md:text-sm shadow-lg">
              <span
                class="relative z-10 flex items-center justify-center gap-2"
                id="cvBtnText"
                >Resume</span
              >
              <div
                class="absolute inset-y-0 right-0 w-0 bg-blue-500 transition-all group-hover:w-full -z-0"></div>
            </button>
            <button
              id="callBtn"
              class="px-4 py-3 rounded-2xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 font-bold text-xs md:text-sm hover:bg-emerald-500/20 transition-all">
              Call Me
            </button>
          </div>
        </div>

        <aside class="lg:col-span-4 min-h-0 flex flex-col">
          <div
            class="glass-card rounded-3xl p-4 md:p-5 h-full flex flex-col min-h-0 overflow-hidden">
            <h3
              class="text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-4 shrink-0 flex items-center gap-2">
              <span class="w-4 h-px bg-blue-500"></span>
              <span id="socialTitle">Digital Presence</span>
            </h3>
            <div
              class="flex-1 overflow-y-auto no-scrollbar grid grid-cols-2 lg:grid-cols-1 gap-2.5"
              id="socialGrid"></div>
          </div>
        </aside>
      </main>

      <footer class="shrink-0 py-1 text-center">
        <p
          class="text-[8px] tracking-[0.4em] text-gray-700 uppercase"
          id="footer">
          Marko Sameh &copy; 2026
        </p>
      </footer>
    </div>

    <script>
      const DATA = {
        en: {
          name: "Marko Sameh",
          role: "Software Developer",
          university: "Future University (FUE)",
          graduation: "Graduation 2025",
          status: "Online",
          labelDev: "Frontend Developer",
          stackTitle: "Tech Stack",
          socialTitle: "Presence",
          stack: [
            "Javascript",
            "React",
            "Next.js",
            "Node.js",
            "TailwindCSS",
            "Redux",
            "TypeScript",
            "Git",
            "Figma",
            "Firebase",
            "Express",
          ],
          cvButton: "Download CV",
          callButton: "Contact Me",
          footer: "Marko Sameh © 2026",
          langButton: "العربية",
        },
        ar: {
          name: "ماركو سامح",
          role: "مطور برمجيات",
          university: "جامعة المستقبل",
          graduation: "دفعة تخرج 2025",
          status: "متصل",
          labelDev: "مطور واجهات أمامية",
          stackTitle: "التقنيات",
          socialTitle: "التواجد الرقمي",
          stack: [
            "Javascript",
            "React",
            "Next.js",
            "Node.js",
            "TailwindCSS",
            "Redux",
            "TypeScript",
            "Git",
            "Figma",
            "Firebase",
            "Express",
          ],
          cvButton: "تحميل السيرة الذاتية",
          callButton: "اتصل بي",
          footer: "ماركو سامح © 2026",
          langButton: "English",
        },
      };

      const SOCIAL = [
        {
          name: "GitHub",
          url: "https://github.com/Marko-sameh",
          icon: "M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z",
          hover: "group-hover:bg-gray-700 group-hover:text-white",
        },
        {
          name: "LinkedIn",
          url: "https://www.linkedin.com/in/markosameh",
          icon: "M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.32 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.79M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z",
          hover: "group-hover:bg-blue-600 group-hover:text-white",
        },
        {
          name: "Email",
          url: "mailto:markosameh75@gmail.com",
          icon: "M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z",
          hover: "group-hover:bg-red-500 group-hover:text-white",
        },
        {
          name: "Portfolio",
          url: "https://markosameh.com/",
          icon: "M20 6h-4V4c0-1.11-.89-2-2-2h-4c-1.11 0-2 .89-2 2v2H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-6 0h-4V4h4v2z",
          hover: "group-hover:bg-indigo-600 group-hover:text-white",
        },
      ];

      let currentLang = localStorage.getItem("lang") || "en";

      function updateContent() {
        const data = DATA[currentLang];
        document.documentElement.lang = currentLang;
        document.documentElement.dir = currentLang === "ar" ? "rtl" : "ltr";

        document.getElementById("profileName").textContent = data.name;
        document.getElementById("labelDev").textContent = data.labelDev;
        document.getElementById("stackTitle").textContent = data.stackTitle;
        document.getElementById("socialTitle").textContent = data.socialTitle;
        document.getElementById("cvBtnText").textContent = data.cvButton;
        document.getElementById("callBtn").textContent = data.callButton;
        document.getElementById("langBtn").textContent = data.langButton;
        document.getElementById("profileUniversity").textContent =
          data.university;
        document.getElementById("profileGraduation").textContent =
          data.graduation;

        document.getElementById("stackTags").innerHTML = data.stack
          .map(
            (tag) =>
              `<span class="px-2.5 py-1 rounded-lg bg-white/5 border border-white/10 text-[9px] md:text-xs font-bold text-blue-100 hover:border-blue-500/30 transition-all">${tag}</span>`,
          )
          .join("");

        document.getElementById("socialGrid").innerHTML = SOCIAL.map(
          (social) => `
          <a href="${social.url}" target="_blank" class="group flex items-center gap-3 p-3 rounded-2xl bg-white/5 border border-white/5 transition-all duration-300 hover:border-white/20">
            <div class="w-8 h-8 md:w-10 md:h-10 rounded-xl bg-white/5 flex items-center justify-center shrink-0 transition-all ${social.hover}">
              <svg class="w-4 h-4 md:w-5 md:h-5 fill-current" viewBox="0 0 24 24"><path d="${social.icon}"/></svg>
            </div>
            <div class="min-w-0">
              <span class="block font-bold text-[10px] md:text-sm text-gray-300 group-hover:text-white truncate">${social.name}</span>
            </div>
          </a>
        `,
        ).join("");
      }

      document.getElementById("langBtn").addEventListener("click", () => {
        currentLang = currentLang === "en" ? "ar" : "en";
        localStorage.setItem("lang", currentLang);
        updateContent();
      });

      document
        .getElementById("cvBtn")
        .addEventListener("click", () =>
          window.open("./Marko sameh Frontend Engineer Resume.pdf", "_blank"),
        );
      document
        .getElementById("callBtn")
        .addEventListener(
          "click",
          () => (window.location.href = "tel:+201203113955"),
        );

      updateContent();
    </script>
  </body>
</html>
