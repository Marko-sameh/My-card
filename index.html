<!doctype html>
<html lang="en" dir="ltr" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marko Sameh - Software Developer</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Cairo:wght@300;400;600;700;800&display=swap"
      rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        --primary: #3b82f6;
        --secondary: #10b981;
        --bg-dark: #030712;
        --card-bg: rgba(17, 24, 39, 0.7);
      }
      body {
        font-family: "Inter", sans-serif;
        background-color: var(--bg-dark);
        color: #f3f4f6;
        background-image:
          radial-gradient(
            circle at 0% 0%,
            rgba(59, 130, 246, 0.15) 0%,
            transparent 35%
          ),
          radial-gradient(
            circle at 100% 100%,
            rgba(16, 185, 129, 0.1) 0%,
            transparent 35%
          );
      }
      [dir="rtl"] body {
        font-family: "Cairo", sans-serif;
      }

      .glass-card {
        background: var(--card-bg);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .glass-card:hover {
        border-color: rgba(59, 130, 246, 0.4);
        transform: translateY(-4px);
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
      }
      .gradient-text {
        background: linear-gradient(135deg, #fff 0%, var(--primary) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .status-pulse {
        position: relative;
      }
      .status-pulse::after {
        content: "";
        position: absolute;
        inset: -2px;
        border-radius: 9999px;
        background: var(--secondary);
        opacity: 0.4;
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.4;
        }
        50% {
          transform: scale(1.5);
          opacity: 0;
        }
      }
    </style>
  </head>
  <body class="antialiased h-screen overflow-hidden flex flex-col">
    <header
      class="max-w-7xl mx-auto w-full px-4 py-2 md:px-6 md:py-6 flex justify-between items-center relative z-10">
      <div class="flex items-center gap-3 px-4 py-2 rounded-full glass-card">
        <div class="w-2.5 h-2.5 rounded-full bg-emerald-500 status-pulse"></div>
        <span
          class="text-xs font-bold tracking-widest uppercase text-emerald-400"
          id="statusText"
          >Online</span
        >
      </div>
      <button
        id="langBtn"
        class="px-5 py-2 rounded-xl glass-card text-sm font-semibold hover:bg-white/10 transition-colors">
        العربية
      </button>
    </header>

    <main
      class="max-w-7xl mx-auto w-full px-4 md:px-6 flex-1 grid lg:grid-cols-12 gap-2 md:gap-6 overflow-y-auto pb-2">
      <div class="lg:col-span-8 flex flex-col gap-2 md:gap-6">
        <section
          class="glass-card rounded-3xl p-3 md:p-8 lg:p-10 relative overflow-hidden group">
          <div
            class="absolute top-0 right-0 w-64 h-64 bg-primary/10 blur-[100px] -mr-32 -mt-32"></div>

          <div
            class="relative flex flex-col md:flex-row gap-3 md:gap-8 items-center md:items-start text-center md:text-left rtl:md:text-right">
            <div class="relative w-24 h-24 md:w-44 md:h-44 shrink-0">
              <div
                class="absolute inset-0 bg-gradient-to-tr from-blue-600 to-emerald-500 rounded-3xl rotate-6 group-hover:rotate-12 transition-transform duration-500"></div>
              <div
                class="relative w-full h-full rounded-3xl overflow-hidden border-2 border-white/20 bg-[#1e293b]">
                <img
                  id="profileImg"
                  src="Marko_photo.jpg"
                  alt="Profile"
                  class="w-full h-full object-cover" />
              </div>
            </div>

            <div class="space-y-1.5 md:space-y-4">
              <div class="space-y-0.5 md:space-y-1">
                <span
                  class="text-blue-400 text-sm font-bold tracking-[0.2em] uppercase"
                  id="labelDev"
                  >Frontend Developer</span
                >
                <h1
                  class="text-xl md:text-4xl lg:text-5xl font-extrabold gradient-text"
                  id="profileName">
                  Marko Sameh
                </h1>
                <p class="text-xs md:text-lg text-gray-400 font-medium">
                  <span id="profileRole">Software Developer</span>
                  <span class="text-white/20 mx-2">|</span>
                  <span id="profileCompany" class="text-blue-400/80"
                    >Freelancer</span
                  >
                </p>
              </div>

              <div
                class="flex flex-wrap gap-1 md:gap-4 justify-center md:justify-start text-xs md:text-sm">
                <div
                  class="flex items-center gap-2 text-sm text-gray-400 glass-card px-4 py-2 rounded-full">
                  <svg
                    class="w-4 h-4 text-blue-400"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24">
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
                  </svg>
                  <span id="profileUniversity">Future University in Egypt</span>
                </div>
                <div
                  class="flex items-center gap-2 text-sm text-gray-400 glass-card px-4 py-2 rounded-full">
                  <svg
                    class="w-4 h-4 text-emerald-400"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24">
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
                  </svg>
                  <span id="profileGraduation">Class of 2025</span>
                </div>
              </div>
            </div>
          </div>
        </section>

        <div class="grid md:grid-cols-2 gap-2 md:gap-6">
          <div class="glass-card rounded-3xl p-3 md:p-6">
            <h3
              class="text-xs md:text-sm font-bold text-gray-500 uppercase tracking-widest mb-2 md:mb-4 flex items-center gap-2">
              <span class="w-8 h-px bg-blue-500"></span>
              <span id="stackTitle">Tech Stack</span>
            </h3>
            <div class="flex flex-wrap gap-2" id="stackTags"></div>
          </div>

          <div
            class="glass-card rounded-3xl p-3 md:p-6 flex flex-col justify-center gap-1.5 md:gap-3">
            <button
              id="cvBtn"
              class="group relative px-3 py-1.5 md:px-6 md:py-3 rounded-2xl bg-white text-gray-900 font-bold overflow-hidden transition-all hover:pr-10 text-sm md:text-base">
              <span
                class="relative z-10 flex items-center justify-center gap-2"
                id="cvBtnText"
                >Download CV</span
              >
              <div
                class="absolute inset-y-0 right-0 w-0 bg-blue-500 transition-all group-hover:w-full -z-0"></div>
            </button>
            <button
              id="callBtn"
              class="px-3 py-1.5 md:px-6 md:py-3 rounded-2xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 font-bold hover:bg-emerald-500/20 transition-all text-sm md:text-base"
              id="callBtnText">
              Call Me
            </button>
          </div>
        </div>
      </div>

      <aside class="lg:col-span-4 flex flex-col gap-2 md:gap-6">
        <div class="glass-card rounded-3xl p-3 md:p-6">
          <h3
            class="text-xs md:text-sm font-bold text-gray-500 uppercase tracking-widest mb-2 md:mb-6 flex items-center gap-2">
            <span class="w-8 h-px bg-blue-500"></span>
            <span id="socialTitle">Digital Presence</span>
          </h3>
          <div
            class="grid grid-cols-2 lg:grid-cols-1 gap-1.5 md:gap-3"
            id="socialGrid"></div>
        </div>
      </aside>
    </main>

    <footer class="py-2 md:py-8 text-center border-t border-white/5">
      <p class="text-xs tracking-[0.3em] text-gray-500 uppercase" id="footer">
        Marko Sameh &copy; 2026
      </p>
    </footer>

    <script>
      const DATA = {
        en: {
          name: "Marko Sameh",
          role: "Software Developer",
          company: "Freelancer",
          university: "Future University (FUE)",
          graduation: "Graduation 2025",
          status: "Online",
          labelDev: "Frontend Developer",
          stackTitle: "Tech Stack",
          socialTitle: "Connect",
          stack: ["Javascript", "React", "Next", "Node", "Express"],
          cvButton: "Download CV",
          callButton: "Contact Me",
          footer: "Marko Sameh © 2026",
          langButton: "العربية",
        },
        ar: {
          name: "ماركو سامح",
          role: "مطور برمجيات",
          company: "عمل حر",
          university: "جامعة المستقبل في مصر",
          graduation: "دفعة تخرج 2025",
          status: "متصل",
          labelDev: "مطور برمجيات",
          stackTitle: "التقنيات",
          socialTitle: "تواصل معي",
          stack: ["Javascript", "React", "Next", "Node", "Express"],
          cvButton: "تحميل السيرة الذاتية",
          callButton: "اتصل بي",
          footer: "ماركو سامح © 2026",
          langButton: "English",
        },
      };

      const SOCIAL = [
        {
          name: "GitHub",
          url: "https://github.com/Marko-sameh",
          color: "hover:bg-gray-800",
          icon: "M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z",
        },
        {
          name: "LinkedIn",
          url: "https://www.linkedin.com/in/markosameh",
          color: "hover:bg-blue-600",
          icon: "M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.32 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.79M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z",
        },
        {
          name: "Email",
          url: "mailto:markosameh75@gmail.com",
          color: "hover:bg-red-600",
          icon: "M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z",
        },
        {
          name: "Portfolio",
          url: "https://markosameh.com/",
          color: "hover:bg-gray-800",
          icon: "M20 6h-4V4c0-1.11-.89-2-2-2h-4c-1.11 0-2 .89-2 2v2H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-6 0h-4V4h4v2z",
        },
      ];

      let currentLang = localStorage.getItem("lang") || "en";

      function updateContent() {
        const data = DATA[currentLang];
        document.documentElement.lang = currentLang;
        document.documentElement.dir = currentLang === "ar" ? "rtl" : "ltr";

        // Text Content
        document.getElementById("profileName").textContent = data.name;
        document.getElementById("profileRole").textContent = data.role;
        document.getElementById("profileCompany").textContent = data.company;
        document.getElementById("profileUniversity").textContent =
          data.university;
        document.getElementById("profileGraduation").textContent =
          data.graduation;
        document.getElementById("statusText").textContent = data.status;
        document.getElementById("labelDev").textContent = data.labelDev;
        document.getElementById("stackTitle").textContent = data.stackTitle;
        document.getElementById("socialTitle").textContent = data.socialTitle;
        document.getElementById("cvBtnText").textContent = data.cvButton;
        document.getElementById("callBtn").textContent = data.callButton;
        document.getElementById("footer").textContent = data.footer;
        document.getElementById("langBtn").textContent = data.langButton;

        // Stack Tags
        document.getElementById("stackTags").innerHTML = data.stack
          .map(
            (tag) =>
              `<span class="px-4 py-2 rounded-xl bg-white/5 border border-white/10 text-xs font-bold text-blue-100 hover:bg-blue-500/10 hover:border-blue-500/30 transition-all cursor-default">${tag}</span>`,
          )
          .join("");

        // Social Grid
        document.getElementById("socialGrid").innerHTML = SOCIAL.map(
          (social) => `
          <a href="${social.url}" target="_blank" class="group flex items-center justify-between p-4 rounded-2xl bg-white/5 border border-white/5 ${social.color} hover:border-transparent transition-all duration-500" >
            <div class="flex items-center gap-4">
              <div class="w-10 h-10 rounded-xl bg-white/5 flex items-center justify-center group-hover:scale-110 transition-transform">
                <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="${social.icon}"/></svg>
              </div>
              <span class="font-bold text-sm">${social.name}</span>
            </div>
            <svg class="w-4 h-4 opacity-0 group-hover:opacity-100 -translate-x-2 group-hover:translate-x-0 transition-all" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
          </a>
        `,
        ).join("");
      }

      document.getElementById("langBtn").addEventListener("click", () => {
        currentLang = currentLang === "en" ? "ar" : "en";
        localStorage.setItem("lang", currentLang);
        updateContent();
      });

      document.getElementById("cvBtn").addEventListener("click", () => {
        const link = document.createElement("a");
        link.href = "./Marko sameh Frontend Engineer Resume.pdf";
        link.download = "Marko_Sameh_CV.pdf";
        link.click();
      });

      document.getElementById("callBtn").addEventListener("click", () => {
        window.location.href = "tel:+201203113955";
      });

      updateContent();
    </script>
  </body>
</html>
